<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px 12px;background:#F7F3EA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
            <tr>
              <td style="padding:8px 8px 20px 8px;font-size:18px;font-weight:700;color:#0E4F47;letter-spacing:-0.01em;">
                Restablecer contraseña
              </td>
            </tr>
            <tr>
              <td style="background:#FEFCF6;border:1px solid #E7DECB;border-radius:16px;padding:28px;">
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#BE9130;">
                  Acceso
                </div>
                <h1 style="font-size:22px;font-weight:700;color:#1C2B28;margin:10px 0 16px 0;line-height:1.3;">
                  Establece tu contraseña nueva
                </h1>
                <p style="font-size:15px;color:#1C2B28;margin:0 0 16px 0;line-height:1.6;">
                  Recibimos una solicitud para restablecer tu contraseña. Abre la siguiente liga
                  para elegir una nueva:
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0;">
                  <tr>
                    <td style="border-radius:10px;background:#0E4F47;">
                      <a
                        href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer"
                        target="_blank"
                        style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#F7F3EA;text-decoration:none;border-radius:10px;"
                      >
                        Establecer mi contraseña
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:13px;color:#5F6E6A;margin:14px 0 0 0;line-height:1.6;">
                  Si no pediste este cambio, ignora este mensaje: tu contraseña actual sigue vigente.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
